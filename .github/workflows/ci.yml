name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache: tag builds publish the .vsix, so a poisoned cache could ship.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      # Node 25+ no longer bundles corepack. The version is exact, and corepack
      # then checks Yarn against the hash in package.json's packageManager.
      - name: Enable corepack
        run: npm install --global corepack@0.36.0 && corepack enable # zizmor: ignore[adhoc-packages]

      - run: yarn install --immutable

      - name: Check generated grammars are up to date
        run: |
          yarn build:grammars
          git diff --exit-code -- syntaxes/

      - name: Compile
        run: yarn compile

      - name: Grammar tests
        run: yarn test

      - name: Package
        run: yarn vsce package --no-dependencies --out vscode-novafile.vsix

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-novafile-vsix
          path: vscode-novafile.vsix
