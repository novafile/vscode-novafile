name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache: tag builds publish the .vsix, so a poisoned cache could ship.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - run: npm ci

      - name: Check generated grammars are up to date
        run: |
          npm run build:grammars
          git diff --exit-code -- syntaxes/

      - name: Compile
        run: npm run compile

      - name: Grammar tests
        run: npm test

      - name: Package
        run: npx @vscode/vsce package --out vscode-novafile.vsix

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vscode-novafile-vsix
          path: vscode-novafile.vsix
