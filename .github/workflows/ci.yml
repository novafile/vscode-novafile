name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check generated grammars are up to date
        run: |
          npm run build:grammars
          git diff --exit-code -- syntaxes/

      - name: Compile
        run: npm run compile

      - name: Grammar tests
        run: npm test

      - name: Package
        run: npx @vscode/vsce package --out vscode-novafile.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vscode-novafile-vsix
          path: vscode-novafile.vsix
