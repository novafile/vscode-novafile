name: Publish

# Publishes a released .vsix to the Visual Studio Marketplace and Open VSX
# with trusted publishing: the job's GitHub OIDC token is exchanged for a
# short-lived credential of each registry, so no token is stored anywhere.
#
# CI's release job dispatches this for every new tag. Run it by hand to
# publish an existing release:
#
#   gh workflow run publish.yml -f tag=v0.4.0
#
# The Marketplace's Trusted Publishing policy (publisher `novafile`) and the
# Open VSX trusted publisher (namespace `novafile`) both name this file and
# the `marketplace` environment. That environment only runs on `main` and
# waits for a maintainer's approval. Both publishes skip a version the
# registry already has, so a run can be repeated after a partial failure.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: marketplace
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read # download the release asset
      id-token: write # exchanged for the registries' credentials
    steps:
      - name: Check the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::not a release tag: $TAG"
            exit 1
          fi

      # vsce and ovsx from the lockfile, not unpinned npx downloads.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Enable corepack
        run: npm install --global corepack@0.36.0 && corepack enable # zizmor: ignore[adhoc-packages]

      # This job can mint publishing credentials, so no dependency may run an
      # install script here; vsce and ovsx need none.
      - name: Install vsce and ovsx
        env:
          YARN_ENABLE_SCRIPTS: "0"
        run: yarn install --immutable

      # Publish exactly the .vsix that CI built and attested for this tag.
      - name: Download and verify the release's .vsix
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          vsix="vscode-novafile-${TAG#v}.vsix"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$vsix" --dir dist
          gh attestation verify "dist/$vsix" --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
            --source-ref "refs/tags/$TAG" \
            --deny-self-hosted-runners
          version=$(unzip -p "dist/$vsix" extension/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')
          if [ "v$version" != "$TAG" ]; then
            echo "::error::$vsix is version $version, not $TAG"
            exit 1
          fi
          mv "dist/$vsix" dist/release.vsix

      - name: Publish to the Visual Studio Marketplace
        run: yarn vsce publish --packagePath dist/release.vsix --oidc --skip-duplicate

      - name: Publish to Open VSX
        run: yarn ovsx publish --packagePath dist/release.vsix --trusted-publishing --skip-duplicate
